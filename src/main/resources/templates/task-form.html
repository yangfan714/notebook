<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务表单 - 任务管理系统</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Share+Tech+Mono&display=swap');

        :root {
            --font-primary: 'Orbitron', sans-serif;
            --font-secondary: 'Share Tech Mono', monospace;
            --neon-blue: #00c3ff;
            --neon-pink: #ff00ff;
            --neon-red: #ff0000;
            --neon-yellow: #ffff00;
            --neon-green: #00ff00;
            --neon-white: #ffffff;
            --neon-black: #000000;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            font-family: var(--font-secondary);
            color: var(--neon-white);
            overflow-x: hidden;
        }

        .form-container {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .form-box {
            position: relative;
            width: 100%;
            max-width: 600px;
            padding: 2.5rem;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            z-index: 1;
            transform: translateY(0);
            transition: transform 0.3s ease;
        }

        .form-box:hover {
            transform: translateY(-5px);
        }

        .form-title {
            font-family: var(--font-primary);
            color: var(--neon-blue);
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            position: relative;
        }

        .form-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--neon-blue), transparent);
        }

        .form-control {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            color: var(--neon-white);
            padding: 0.8rem 1rem;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            background: rgba(0, 0, 0, 0.3);
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 195, 255, 0.3);
            color: var(--neon-white);
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .form-label {
            color: var(--neon-blue);
            font-family: var(--font-primary);
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .btn-submit {
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-pink));
            border: none;
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 8px;
            font-family: var(--font-primary);
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .btn-submit::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }

        .btn-submit:hover::before {
            transform: translateX(100%);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 195, 255, 0.4);
        }

        .priority-select {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            color: var(--neon-white);
            padding: 0.8rem 1rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .priority-select:focus {
            background: rgba(0, 0, 0, 0.3);
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 195, 255, 0.3);
            color: var(--neon-white);
        }

        .priority-select option {
            background: #1a1a2e;
            color: var(--neon-white);
        }

        .particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        @media (max-width: 576px) {
            .form-box {
                padding: 2rem;
                margin: 1rem;
            }
        }
    </style>
</head>
<body>
    <div id="particles-js" class="particles-container"></div>
    <div class="form-container">
        <div class="form-box">
            <h1 class="form-title">添加新任务</h1>
            <form th:action="@{/task/add}" method="post">
                <div class="mb-3">
                    <label for="title" class="form-label">任务标题</label>
                    <input type="text" class="form-control" id="title" name="title" required>
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label">任务描述</label>
                    <textarea class="form-control" id="description" name="description" rows="4"></textarea>
                </div>
                <div class="form-group mb-3">
                    <label for="dueDate" class="form-label">截止日期</label>
                    <input type="date" class="form-control" id="dueDate" name="dueDate" required>
                </div>
                <div class="form-group mb-3">
                    <label for="dueTime" class="form-label">截止时间</label>
                    <input type="time" class="form-control" id="dueTime" name="dueTime" value="23:59" required>
                </div>
                <div class="form-group">
                    <label for="priority">优先级</label>
                    <select class="form-control" id="priority" name="priority" required>
                        <option value="1">低</option>
                        <option value="2">中</option>
                        <option value="3">高</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-submit">
                    <i class="fas fa-plus me-2"></i>添加任务
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script>
        particlesJS.load('particles-js', '/js/particles.json', function() {
            console.log('particles.js loaded - callback');
        });

        // 设置日期输入的最小值为今天
        const today = new Date();
        const dateInput = document.getElementById('dueDate');
        dateInput.min = today.toISOString().split('T')[0];
        dateInput.value = today.toISOString().split('T')[0];

        // 设置时间输入的默认值为23:59
        const timeInput = document.getElementById('dueTime');
        if (!timeInput.value) {
            timeInput.value = '23:59';
        }
    </script>
</body>
</html>
