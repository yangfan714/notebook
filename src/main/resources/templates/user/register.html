<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 任务管理系统</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Share+Tech+Mono&display=swap');

        :root {
            --font-primary: 'Orbitron', sans-serif;
            --font-secondary: 'Share Tech Mono', monospace;
            --neon-blue: #00c3ff;
            --neon-pink: #ff00ff;
            --neon-red: #ff0000;
            --neon-yellow: #ffff00;
            --neon-green: #00ff00;
            --neon-white: #ffffff;
            --neon-black: #000000;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            font-family: var(--font-secondary);
            color: var(--neon-white);
            overflow-x: hidden;
        }

        .register-container {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .register-box {
            position: relative;
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            z-index: 1;
            transform: translateY(0);
            transition: transform 0.3s ease;
        }

        .register-box:hover {
            transform: translateY(-5px);
        }

        .register-title {
            font-family: var(--font-primary);
            color: var(--neon-blue);
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            position: relative;
        }

        .register-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--neon-blue), transparent);
        }

        .form-control {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            color: var(--neon-white);
            padding: 0.8rem 1rem;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            background: rgba(0, 0, 0, 0.3);
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 195, 255, 0.3);
            color: var(--neon-white);
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .btn-register {
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-pink));
            border: none;
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 8px;
            font-family: var(--font-primary);
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .btn-register::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }

        .btn-register:hover::before {
            transform: translateX(100%);
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 195, 255, 0.4);
        }

        .floating-label {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .floating-label label {
            position: absolute;
            top: 0.8rem;
            left: 1rem;
            color: rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .floating-label input:focus + label,
        .floating-label input:not(:placeholder-shown) + label {
            top: -0.5rem;
            left: 0.8rem;
            font-size: 0.8rem;
            color: var(--neon-blue);
            background: rgba(0, 0, 0, 0.8);
            padding: 0 0.5rem;
            border-radius: 4px;
        }

        .login-link {
            color: var(--neon-blue);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .login-link:hover {
            color: var(--neon-pink);
            text-shadow: 0 0 5px var(--neon-pink);
        }

        .particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        @media (max-width: 576px) {
            .register-box {
                padding: 2rem;
                margin: 1rem;
            }
        }
    </style>
</head>
<body>
    <div id="particles-js" class="particles-container"></div>
    <div class="register-container">
        <div class="register-box">
            <h1 class="register-title">注册账号</h1>
            <form th:action="@{/user/register}" method="post">
                <div class="floating-label">
                    <input type="text" class="form-control" id="username" name="username" placeholder=" " required>
                    <label for="username">用户名</label>
                </div>
                <div class="floating-label">
                    <input type="password" class="form-control" id="password" name="password" placeholder=" " required>
                    <label for="password">密码</label>
                </div>
                <div class="floating-label">
                    <input type="email" class="form-control" id="email" name="email" placeholder=" ">
                    <label for="email">邮箱（可选）</label>
                </div>
                <button type="submit" class="btn btn-register">
                    <i class="fas fa-user-plus me-2"></i>注册
                </button>
                <div class="text-center mt-3">
                    <a th:href="@{/user/login}" class="login-link">
                        <i class="fas fa-sign-in-alt me-2"></i>已有账号？立即登录
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script>
        particlesJS.load('particles-js', '/js/particles.json', function() {
            console.log('particles.js loaded - callback');
        });
    </script>
</body>
</html>
